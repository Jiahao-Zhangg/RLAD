[project]
name = "rlad-autoresearch"
version = "0.1.0"
description = "Portable two-node RLAD hint-book autoresearch harness"
requires-python = ">=3.10,<3.13"
dependencies = [
    "claude-agent-sdk==0.2.93",
    "datasets==3.6.0",
    "huggingface-hub==0.36.2",
    "math-verify==0.6.0",
    "numpy==2.2.6",
    "packaging==25.0",
    "pyarrow==24.0.0",
    "pylatexenc==2.10",
    "setuptools>=81",
    "sympy==1.13.1",
    "torch==2.6.0",
    "transformers==4.51.3",
    "vllm==0.8.5.post1",
    "wheel>=0.47"
]

[dependency-groups]
dev = [
    "pytest==8.3.5"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

